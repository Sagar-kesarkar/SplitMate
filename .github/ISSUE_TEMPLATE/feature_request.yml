name: Feature request
description: Suggest a focused improvement to SplitMate.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data, privacy and migration impact
      description: Explain Room, Demo/Live, permissions or network implications.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not include private financial or contact data.
          required: true
