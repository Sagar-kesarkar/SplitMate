name: Bug report
description: Report a reproducible SplitMate problem using non-sensitive sample data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real financial records, contacts, databases, credentials or signing files.
  - type: input
    id: version
    attributes:
      label: SplitMate version
      placeholder: 1.1.0-beta.1 (code 2)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Data mode
      options:
        - Demo
        - Live
        - Both
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal data, secrets and private files.
          required: true
